name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # bash on every runner, so the globs expand the same way on Windows. The globs
      # take in every skill's tests, so a new skill needs no change here.
      - name: Run the helper tests
        shell: bash
        run: node --test scripts/*.test.mjs appmap-*/assets/*.test.mjs
