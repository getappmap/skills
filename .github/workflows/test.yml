name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # bash on every runner, so the globs expand the same way on Windows.
      - name: Run the helper tests
        shell: bash
        run: node --test appmap-gold-traces/assets/*.test.mjs appmap-review/assets/*.test.mjs
