colors:
  background: "#0d0a1a"
  foreground: "#f2effb"
  card: "#16112b"
  card-foreground: "#f2effb"
  primary: "#ff07aa"
  primary-foreground: "#ffffff"
  secondary: "#0f0b1d"
  secondary-foreground: "#f2effb"
  muted: "#1c1538"
  muted-foreground: "#a99fc7"
  accent: "#8b5cf6"
  accent-foreground: "#ffffff"
  border: rgba(167, 139, 250, 0.22)
  support: "#7c8aa6"
  caption-chip: rgba(15, 11, 29, 0.9)
  caption-text: "#f2effb"
  caption-word: "#ff07aa"
fonts:
  display: '"Inter Tight", "Inter", ui-sans-serif, system-ui, sans-serif'
  body: '"Inter", ui-sans-serif, system-ui, sans-serif'
  load:
    - https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&display=swap
    - https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap
atmosphere:
  gradient-stage: "radial-gradient(120% 70% at 50% 0%, rgba(255, 7, 170, 0.12), transparent 60%), linear-gradient(180deg, #131024 0%, #0d0a1a 100%)"
  gradient-accent: "linear-gradient(90deg, #ff07aa 0%, #a21caf 100%)"
